[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
# Patched copies of dependencies (see [patch.crates-io]), not ours to lint.
exclude = ["vendor"]

# netwatch (iroh's network monitor) found the default route on Windows with
# a WMI query, over COM, from each endpoint's own thread: with endpoints
# opening at once, COM in this process used memory already freed (hangs and
# crashes on the Windows runner of CI). The copy in vendor/netwatch asks the
# IP Helper instead (see its src/interfaces/windows.rs); nothing else changed.
[patch.crates-io]
netwatch = { path = "vendor/netwatch" }

[workspace.package]
version = "0.8.2"
license = "AGPL-3.0-only"
repository = "https://github.com/alexpacheli/hext-remote"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
hext-clipboard = { path = "crates/clipboard" }
hext-crypto = { path = "crates/crypto" }
hext-signal = { path = "crates/signal" }
hext-server = { path = "apps/hext-server" }
hext-proto = { path = "crates/proto" }
hext-net = { path = "crates/net" }
hext-metrics = { path = "crates/metrics" }
hext-capture = { path = "crates/capture" }
hext-codec = { path = "crates/codec" }
hext-input = { path = "crates/input" }
hext-render = { path = "crates/render" }
hext-session = { path = "crates/session" }
hext-audio = { path = "crates/audio" }

anyhow = "1.0"
arboard = { version = "3.7", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
gethostname = "1.1"
hex = "0.4"
# Transport: QUIC with hole punching and relays; endpoints are their keys.
iroh = "1.4"
# Software H.264 (Cisco OpenH264, built from source): encoder and decoder fallback.
openh264 = "0.9"
pollster = "1.0"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
# Sound: Opus (libopus, built from source by CMake) and the audio devices.
opus = "0.4"
cpal = "0.18"
# Forward error correction for video datagrams.
reed-solomon-erasure = "6"
# SQLite compiled in (no system library): the server's database.
rusqlite = { version = "0.41", features = ["bundled"] }
# Account e-mails over SMTP (Brevo or any provider), TLS by rustls (ring).
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls"] }
ring = "0.17"
# Unattended password: key exchange and stretching.
spake2 = "0.4"
argon2 = "0.5"
# A password typed on the terminal without showing it.
rpassword = "7.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
bytes = "1"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net", "io-util", "fs"] }
# WebSocket client for signaling; TLS through our rustls (ring) config.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1.8"
block2 = "0.6"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-video-toolbox = "0.3"
wgpu = "30"
winit = "0.30"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_System_DataExchange",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The password's stretching is slow on purpose; unoptimized, it takes most of
# the handshake's 10 s in tests and debug builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
