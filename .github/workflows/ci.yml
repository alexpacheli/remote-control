name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            artifact: HextRemote-windows-x64
          - name: macOS universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: HextRemote-macos-universal
          - name: Linux x64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
            artifact: hext-remote-linux-x64
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml and caches the cargo registry and target dir.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.targets }}

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked -p hext -p hext-spike --target x86_64-pc-windows-msvc
          mkdir dist
          cp target/x86_64-pc-windows-msvc/release/hext.exe dist/HextRemote.exe
          cp target/x86_64-pc-windows-msvc/release/hext-spike.exe dist/hext-spike.exe

      - name: Build release (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p hext -p hext-spike --target aarch64-apple-darwin
          cargo build --release --locked -p hext -p hext-spike --target x86_64-apple-darwin
          mkdir dist
          lipo -create -output dist/HextRemote \
            target/aarch64-apple-darwin/release/hext \
            target/x86_64-apple-darwin/release/hext
          lipo -create -output dist/hext-spike \
            target/aarch64-apple-darwin/release/hext-spike \
            target/x86_64-apple-darwin/release/hext-spike
          lipo -info dist/HextRemote

      - name: Build release (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked -p hext -p hext-spike --target x86_64-unknown-linux-gnu
          mkdir dist
          cp target/x86_64-unknown-linux-gnu/release/hext dist/hext-remote
          cp target/x86_64-unknown-linux-gnu/release/hext-spike dist/hext-spike

      - name: Smoke test
        shell: bash
        run: for bin in dist/*; do "$bin" --version; done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
