name: Release

# The installers (F6). A tag `v*` (e.g. v0.6.0) builds everything and opens a
# draft release on GitHub with the files; "Run workflow" by hand builds them
# only as artifacts, to test.
#
# Signing and notarization use the repository's secrets, when they are there
# (without them, the files come out unsigned, as today):
#   Windows: WINDOWS_CERTIFICATE (the .pfx in base64), WINDOWS_CERTIFICATE_PASSWORD
#   macOS:   APPLE_CERTIFICATE (the Developer ID .p12 in base64), APPLE_CERTIFICATE_PASSWORD,
#            APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID
#   Update:  UPDATE_SIGNING_KEY (marco 2), with the public half in the variable HEXT_UPDATE_KEY
#
# Each secret reaches only the steps that use it, and none of them runs for a
# pull request (nor for main). The actions are pinned by commit (the tag in
# the comment).
#
# Caches: a tag can only read the caches of main (GitHub keeps each ref's to
# itself and the default branch), so main builds the installers too, unsigned
# and unpublished, and is the only one that saves them (`cache-save-if`):
# a tag then compiles only this project's crates, not every dependency.

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  # The installers changed: built and tested, not published.
  pull_request:
    paths: ["installer/**", ".github/workflows/release.yml", "apps/hext/Cargo.toml"]
  workflow_dispatch:

# A newer main replaces the build of the last one (a tag always finishes).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

# Reading only; the job that opens the release (publish) asks for writing.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  HEXT_UPDATE_KEY: ${{ vars.HEXT_UPDATE_KEY }}
  # The app looks for updates in the releases of the repository that built it.
  HEXT_RELEASES: https://github.com/${{ github.repository }}/releases
  # A copy of the project with its own server sets these variables (Settings,
  # Variables): wss://signal.<domain> and https://relay.<domain>. Empty, ours.
  HEXT_SERVER: ${{ vars.HEXT_SERVER }}
  HEXT_RELAY: ${{ vars.HEXT_RELAY }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: version
        name: Version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::a tag ${GITHUB_REF_NAME} não bate com a versão $version do Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Whether to sign ("true" or "false"), not the certificate: that one only
      # in the steps that sign; only for a tag or by hand (never a pull request
      # nor main).
      SIGN: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: x86_64-pc-windows-msvc
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked -p hext --target x86_64-pc-windows-msvc
          mkdir dist
          cp target/x86_64-pc-windows-msvc/release/hext.exe dist/HextRemote.exe

      - name: Certificate
        if: github.event_name != 'pull_request' && env.SIGN == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Sign the program
        if: github.event_name != 'pull_request' && env.SIGN == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD dist\HextRemote.exe

      # The virtual monitor's driver (docs/monitor-virtual.md): the release
      # pinned here, checked against its hash (GitHub's digest of the file,
      # the same as Get-FileHash gives). The asset says x86, but it is the
      # x64 build (the one the project's own script installs): checked too.
      # It goes inside the MSI: nothing is downloaded on the customer's
      # computer.
      - name: Virtual monitor driver
        shell: pwsh
        env:
          VDD_URL: https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip
          VDD_SHA256: e24210692b442b39af763536330ce78b423f19342b7a7792c26de3944e418b3a
        run: |
          $zip = "$env:RUNNER_TEMP\vdd.zip"
          Invoke-WebRequest $env:VDD_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne $env:VDD_SHA256) { throw "driver do monitor virtual: SHA-256 $hash, esperado $env:VDD_SHA256" }
          Expand-Archive $zip "$env:RUNNER_TEMP\vdd"
          $out = New-Item -ItemType Directory "$env:RUNNER_TEMP\vdd-msi"
          foreach ($name in "MttVDD.inf", "MttVDD.dll", "mttvdd.cat") {
            Copy-Item "$env:RUNNER_TEMP\vdd\VirtualDisplayDriver\$name" $out
          }
          Copy-Item installer\windows\driver\LICENSE.txt $out
          $dll = [IO.File]::ReadAllBytes("$out\MttVDD.dll")
          $machine = [BitConverter]::ToUInt16($dll, [BitConverter]::ToInt32($dll, 0x3c) + 4)
          if ($machine -ne 0x8664) { throw ("driver do monitor virtual: não é x64 (0x{0:X})" -f $machine) }
          "VDD_DIR=$out" >> $env:GITHUB_ENV

      - name: Installer (.msi)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix build installer\windows\HextRemote.wxs -arch x64 -culture pt-BR -ext WixToolset.UI.wixext `
            -d Version=$env:VERSION -d Exe=dist\HextRemote.exe -d Icon=apps\hext\icons\icon.ico `
            -d Driver=$env:VDD_DIR -o "dist\HextRemote-$env:VERSION-x64.msi"
          # (WiX's debug symbols: not for the release.)
          Remove-Item dist\*.wixpdb -ErrorAction SilentlyContinue

      - name: Sign the installer
        if: github.event_name != 'pull_request' && env.SIGN == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD "dist\HextRemote-$env:VERSION-x64.msi"
          Remove-Item "$env:RUNNER_TEMP\cert.pfx" -Force

      # Installs, checks the service, removes: what a user does.
      - name: Install test
        shell: pwsh
        run: |
          $msi = (Resolve-Path "dist\HextRemote-$env:VERSION-x64.msi").Path
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; exit $p.ExitCode }
          & "C:\Program Files\Hext Remote\HextRemote.exe" --version
          sc.exe query HextRemote
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 60; exit $p.ExitCode }
          if (Test-Path "C:\Program Files\Hext Remote\HextRemote.exe") { throw "ficou instalado" }

      # The same with the virtual monitor (on GitHub's machine, never on a
      # developer's): the device installed and disabled, the certificate in
      # TrustedPublisher, and nothing of it left after removing the Hext.
      # Informative: a runner without what the driver needs does not hold
      # the release (the step shows the failure).
      - name: Install test (virtual monitor)
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        env:
          SIGNER: 3CF8CF26D8BA266C3A483AB7D26D4A818E317D76
        run: |
          function Get-Vdd { Get-PnpDevice -Class Display -ErrorAction SilentlyContinue | Where-Object { $_.HardwareID -contains 'Root\MttVDD' } }
          $msi = (Resolve-Path "dist\HextRemote-$env:VERSION-x64.msi").Path
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" ADDLOCAL=ALL /qn /l*v install-vdd.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install-vdd.log -Tail 60; exit $p.ExitCode }
          Get-Content "$env:ProgramData\HextRemote\service.log" -Tail 20 -ErrorAction SilentlyContinue
          & "C:\Program Files\Hext Remote\HextRemote.exe" service status
          $device = Get-Vdd
          $device | Format-List FriendlyName, Status, Problem, InstanceId
          if (-not $device) { throw "o dispositivo do monitor virtual não foi criado" }
          if ("$($device.Problem)" -notin 'CM_PROB_DISABLED', '22') { throw "o dispositivo não ficou desabilitado: $($device.Problem)" }
          if (-not (Test-Path "Cert:\LocalMachine\TrustedPublisher\$env:SIGNER")) { throw "o certificado não foi inserido" }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v uninstall-vdd.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall-vdd.log -Tail 60; exit $p.ExitCode }
          if (Get-Vdd) { throw "o dispositivo ficou" }
          if (Test-Path "Cert:\LocalMachine\TrustedPublisher\$env:SIGNER") { throw "o certificado ficou" }
          if ((pnputil /enum-drivers) -match 'mttvdd\.inf') { throw "o driver ficou no repositório" }

      - name: Portable
        shell: bash
        run: cp dist/HextRemote.exe "dist/HextRemote-$VERSION-portable.exe" && rm dist/HextRemote.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: dist/
          if-no-files-found: error

  # The two halves of the universal app, at the same time (one after the other
  # they took most of the release).
  macos-build:
    needs: version
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          # One cache per half; saved only from main (see the top).
          cache-key: ${{ matrix.target }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --release --locked -p hext --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/hext
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: [version, macos-build]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Whether to sign ("true" or "false"), not the certificate: that one only
      # in the steps that sign; only for a tag or by hand (never a pull request
      # nor main).
      SIGN: ${{ (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: macos-*
          path: halves

      - name: Universal
        run: |
          mkdir dist
          lipo -create -output dist/HextRemote \
            halves/macos-aarch64-apple-darwin/hext \
            halves/macos-x86_64-apple-darwin/hext
          chmod +x dist/HextRemote
          lipo -info dist/HextRemote

      - name: Certificate
        id: certificate
        if: github.event_name != 'pull_request' && env.SIGN == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          password="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # A .p12 is DER: it starts with 0x30. Anything else is the wrong file
          # (a .cer, a PEM, a cut paste), and `security` would only say "Unknown format".
          size=$(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' ')
          first=$(head -c 1 "$RUNNER_TEMP/cert.p12" | od -An -tx1 | tr -d ' \n')
          echo "Certificado: $size bytes"
          if [ "$first" != "30" ] || [ "$size" -lt 1500 ]; then
            echo "::error::APPLE_CERTIFICATE não é um .p12 em base64: exporte de Meus Certificados (com a chave privada) e use base64 -i arquivo.p12"
            exit 1
          fi
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "imported=true" >> "$GITHUB_OUTPUT"

      # Signed and notarized only with the certificate in the keychain (the
      # step above): otherwise these are empty and bundle.sh does neither.
      - name: App and disk image
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.certificate.outputs.imported == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ steps.certificate.outputs.imported == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_PASSWORD: ${{ steps.certificate.outputs.imported == 'true' && secrets.APPLE_APP_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.certificate.outputs.imported == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          installer/macos/bundle.sh dist/HextRemote "$VERSION" dist
          rm -rf dist/HextRemote "dist/Hext Remote.app"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: dist/
          if-no-files-found: error

  linux:
    name: linux (${{ matrix.arch }})
    needs: version
    # glibc 2.35: the packages run on older distros too. ARM (arm64): Linux on
    # Apple chips (UTM, Parallels), Raspberry Pi, ARM servers.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.arch }}-unknown-linux-gnu
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      # The interface: WebKitGTK, to build with; the sound: ALSA.
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev

      - name: Build
        run: |
          cargo build --release --locked -p hext --target ${{ matrix.arch }}-unknown-linux-gnu
          mkdir dist

      - name: Packages (.deb, .rpm)
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked
          cargo deb -p hext --target ${{ matrix.arch }}-unknown-linux-gnu --no-build --output dist/
          cargo generate-rpm -p apps/hext --target ${{ matrix.arch }}-unknown-linux-gnu --output dist/

      # appimagetool and the runtime it puts at the head of the AppImage: fixed
      # versions, checked against their hashes (the "continuous" release
      # changes under the same name). The hashes are GitHub's digests of those
      # files, the same as sha256sum gives for them. x86_64 only: on ARM, the
      # .deb and the .rpm.
      - name: AppImage
        if: matrix.arch == 'x86_64'
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          curl -fsSL -o appimagetool "$APPIMAGETOOL_URL"
          curl -fsSL -o runtime-x86_64 "$RUNTIME_URL"
          printf '%s  appimagetool\n%s  runtime-x86_64\n' "$APPIMAGETOOL_SHA256" "$RUNTIME_SHA256" | sha256sum -c -
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool-bin
          sudo install -m 644 runtime-x86_64 /usr/local/share/appimage-runtime-x86_64
          rm runtime-x86_64
          printf '#!/bin/sh\nexec /usr/local/bin/appimagetool-bin --appimage-extract-and-run --runtime-file /usr/local/share/appimage-runtime-x86_64 "$@"\n' |
            sudo tee /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool
          installer/linux/appimage.sh target/x86_64-unknown-linux-gnu/release/hext "$VERSION" dist

      # Each package on a clean machine, as a user's: it installs alone, the
      # interface opens, the viewer shows video, and it is removed.
      - name: Install test (.deb, Ubuntu)
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/dist:ro" -v "$RUNNER_TEMP/shots:/shots" ubuntu:24.04 \
            bash /src/installer/linux/package-test.sh "/dist/$(basename dist/*.deb)" /shots/ubuntu
      - name: Install test (.rpm, Fedora)
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/dist:ro" -v "$RUNNER_TEMP/shots:/shots" fedora:43 \
            bash /src/installer/linux/package-test.sh "/dist/$(basename dist/*.rpm)" /shots/fedora
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: interface-linux-packages-${{ matrix.arch }}
          path: ${{ runner.temp }}/shots/
          if-no-files-found: ignore
      - name: Install test (AppImage)
        if: matrix.arch == 'x86_64'
        run: |
          chmod +x dist/*.AppImage
          dist/HextRemote-$VERSION-x86_64.AppImage --appimage-extract-and-run --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

      # The program publish signs the list with: hext-release, built above
      # from the source. Small on purpose: no interface, no network. It must
      # stay so, since it is what runs next to the key. The x86_64 one: publish
      # runs on x86_64.
      - name: Signer links nothing of the interface
        if: matrix.arch == 'x86_64'
        run: |
          signer=target/x86_64-unknown-linux-gnu/release/hext-release
          readelf -d "$signer" | grep NEEDED
          if readelf -d "$signer" | grep NEEDED | grep -Eq 'gtk|gdk|webkit|soup|cairo|xkbcommon'; then
            echo "::error::hext-release linka bibliotecas da interface"; exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.arch == 'x86_64'
        with:
          name: signer
          path: target/x86_64-unknown-linux-gnu/release/hext-release
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref_type == 'tag'
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-22.04
    # The only job that writes: it opens the release.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The installers only (not the Mac halves nor the signer).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      # The program that signs the list: built from the source by the Linux
      # job (no build here: nothing compiled ever runs next to the key but
      # this one program), away from dist so it is not released.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signer
          path: ${{ runner.temp }}/signer
      - name: Signer
        run: chmod +x "$RUNNER_TEMP/signer/hext-release" && "$RUNNER_TEMP/signer/hext-release" --version
      # The signed list the apps update from (none without the key).
      - name: Update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::sem UPDATE_SIGNING_KEY: esta versão não vai para a atualização automática"
            exit 0
          fi
          "$RUNNER_TEMP/signer/hext-release" manifest dist "$VERSION"
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes \
            --title "Hext Remote $VERSION"
