[package]
name = "hext"
description = "Hext Remote desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
gethostname.workspace = true
hext-audio.workspace = true
hext-capture.workspace = true
hext-clipboard.workspace = true
hext-codec.workspace = true
hex.workspace = true
hext-crypto.workspace = true
hext-input.workspace = true
hext-net.workspace = true
hext-proto.workspace = true
hext-render.workspace = true
hext-session.workspace = true
hext-signal.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
ring.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true
zeroize.workspace = true
# The interface: its pages embedded in the executable, also without the Tauri
# CLI. (On Linux, in WebKitGTK: libwebkit2gtk-4.1 to build and to run.)
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# The question before taking a file, over the session's window.
rfd = { version = "0.17", default-features = false }
# The authenticator link as a QR code (2FA of the account).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
hext-server = { path = "../hext-server" }

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# The question before taking a file: GTK, already there for the interface.
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[lints]
workspace = true

# The Linux packages: cargo deb / cargo generate-rpm, in the release pipeline.
# The libraries the program links (WebKitGTK, GTK) are found in it; the ones
# the viewer's window opens only when it starts (keyboard on X11, Vulkan and
# EGL for the video) are named here, or the window would not open.
[package.metadata.deb]
name = "hext-remote"
maintainer = "Hext Remote <suporte@hext.com.br>"
copyright = "Hext"
extended-description = "Acesso e suporte remoto. No Linux, por enquanto, para acessar outros computadores."
section = "net"
priority = "optional"
depends = "$auto, libxkbcommon-x11-0, libvulkan1, libegl1"
recommends = "mesa-vulkan-drivers"
assets = [
    ["target/release/hext", "usr/bin/hext-remote", "755"],
    ["../../installer/linux/hext-remote.desktop", "usr/share/applications/", "644"],
    ["icons/icon.png", "usr/share/icons/hicolor/512x512/apps/hext-remote.png", "644"],
]

[package.metadata.generate-rpm]
name = "hext-remote"
license = "AGPL-3.0-only"
summary = "Hext Remote: acesso remoto"
assets = [
    { source = "target/release/hext", dest = "/usr/bin/hext-remote", mode = "755" },
    { source = "../../installer/linux/hext-remote.desktop", dest = "/usr/share/applications/hext-remote.desktop", mode = "644" },
    { source = "icons/icon.png", dest = "/usr/share/icons/hicolor/512x512/apps/hext-remote.png", mode = "644" },
]

# By hand: what the program links directly, by soname (the automatic list
# reads every library under them on the build's Ubuntu, with its versions:
# ICU 70, libjpeg 8… that Fedora does not have).
auto-req = "no"

[package.metadata.generate-rpm.requires]
"libwebkit2gtk-4.1.so.0()(64bit)" = "*"
"libjavascriptcoregtk-4.1.so.0()(64bit)" = "*"
"libsoup-3.0.so.0()(64bit)" = "*"
"libgtk-3.so.0()(64bit)" = "*"
"libgdk-3.so.0()(64bit)" = "*"
"libgdk_pixbuf-2.0.so.0()(64bit)" = "*"
"libcairo.so.2()(64bit)" = "*"
"libgio-2.0.so.0()(64bit)" = "*"
"libgobject-2.0.so.0()(64bit)" = "*"
"libglib-2.0.so.0()(64bit)" = "*"
"libdbus-1.so.3()(64bit)" = "*"
"libstdc++.so.6()(64bit)" = "*"
# The sound of the computer accessed (ALSA, through cpal).
"libasound.so.2()(64bit)" = "*"
# Opened by the viewer's window when it starts.
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libvulkan.so.1()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
mesa-vulkan-drivers = "*"
