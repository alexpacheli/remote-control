[package]
name = "hext"
description = "Hext Remote desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
gethostname.workspace = true
hext-capture.workspace = true
hext-codec.workspace = true
hext-crypto.workspace = true
hext-input.workspace = true
hext-net.workspace = true
hext-proto.workspace = true
hext-render.workspace = true
hext-session.workspace = true
hext-signal.workspace = true
ring.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
