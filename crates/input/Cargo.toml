[package]
name = "hext-input"
description = "Hext Remote input injection (SendInput on Windows) and key mapping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hext-proto.workspace = true
tracing.workspace = true
winit.workspace = true

[target.'cfg(windows)'.dependencies]
hext-capture.workspace = true
windows = { workspace = true, features = [
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The privacy screen: its windows (AppKit, on the main queue) and leaving
# them out of the capture.
dispatch2 = "0.3"
hext-capture.workspace = true
objc2.workspace = true
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSGraphics",
    "NSLayoutConstraint",
    "NSResponder",
    "NSScreen",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true

[lints]
workspace = true
